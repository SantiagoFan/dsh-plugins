name: Publish workspace to npm

# tag 形如 dsh-wechat-bot@v1.4.0（短包名@v版本），只发布对应的那个 workspace 包
on:
  push:
    tags:
      - 'dsh-*@v*'
  # 手动触发用一个已存在的 tag 重试，不必新打版本
  workflow_dispatch:
    inputs:
      tag:
        description: '要模拟的发布 tag，例如 dsh-todo-workbench@v1.0.1'
        required: true

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 需要 npm >= 11.5.1
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      # 诊断：把 GitHub 实际签发的 OIDC 声明打出来，和 npm 上登记的
      # Repository / Workflow file name / Environment 三个字段逐项对照。
      - name: OIDC claims (diagnostic)
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::无法获取 OIDC token（缺少 id-token: write 权限？）"
            exit 0
          fi
          TOKEN=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::OIDC token 请求失败"
            exit 0
          fi
          PAYLOAD=$(echo "${TOKEN}" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          CLAIMS=$(echo "${PAYLOAD}" | base64 -d 2>/dev/null | jq -c '{repository, repository_owner, workflow_ref, job_workflow_ref, environment, ref, event_name, sub}')
          echo "OIDC claims: ${CLAIMS}"
          echo "::notice::OIDC claims: ${CLAIMS}"
          echo "对照 npm 侧：Repository=SantiagoFan/dsh-plugins, Workflow file name=publish.yml, Environment=(空), Allowed actions=☑ npm publish"

      - name: Resolve package from tag
        id: ws
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          SHORT="${TAG%@*}"
          TAG_VERSION="${TAG##*@v}"
          echo "tag=${TAG} short=${SHORT} version=${TAG_VERSION}"
          node scripts/resolve-workspace.mjs "${SHORT}" > /tmp/ws.env
          cat /tmp/ws.env >> "$GITHUB_ENV"
          . /tmp/ws.env
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          if [ "${VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::tag ${TAG} 与 ${NAME} 的 package.json 版本 ${VERSION} 不一致"
            exit 1
          fi

      - name: Validate package contents
        working-directory: ${{ steps.ws.outputs.dir }}
        run: npm pack --dry-run

      - name: Publish to npm
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: ${{ steps.ws.outputs.dir }}
        run: |
          set +e
          npm publish --access public --provenance 2>&1 | tee /tmp/publish.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && [ -n "${NPM_TOKEN}" ]; then
            echo "OIDC publish failed; retrying with NPM_TOKEN (without provenance)"
            NODE_AUTH_TOKEN="${NPM_TOKEN}" npm publish --access public 2>&1 | tee /tmp/publish.log
            code=${PIPESTATUS[0]}
          fi
          if [ "$code" -ne 0 ]; then
            grep -E "npm (error|ERR)" /tmp/publish.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$code"
          fi
